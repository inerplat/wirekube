---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: wirekubegateways.wirekube.io
spec:
  group: wirekube.io
  names:
    kind: WireKubeGateway
    listKind: WireKubeGatewayList
    plural: wirekubegateways
    shortNames:
    - wkgw
    singular: wirekubegateway
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.activePeer
      name: Active
      type: string
    - jsonPath: .status.ready
      name: Ready
      type: boolean
    - jsonPath: .status.routesInjected
      name: Routes
      type: integer
    - jsonPath: .status.ipsecSummary
      name: IPsec
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          WireKubeGateway defines a virtual gateway in the WireKube mesh.
          It enables mesh nodes to reach networks (VPC CIDRs, private link endpoints)
          behind a designated gateway node, similar to a VGW in AWS Site-to-Site VPN.
          Multiple PeerRefs provide HA with automatic failover on health check failure.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              WireKubeGatewaySpec defines the desired state of WireKubeGateway.
              A gateway acts as a Virtual Gateway (VGW) in the mesh, enabling other nodes
              to access networks behind the gateway node via its WireGuard tunnel.
            properties:
              clientRefs:
                description: |-
                  ClientRefs lists WireKubePeer names that should route traffic through this gateway.
                  Only these peers will get kernel routes for the gateway's CIDRs.
                  If empty, all mesh peers (except gateway peers and peers already in the CIDR) are clients.
                items:
                  type: string
                type: array
              healthCheck:
                description: |-
                  HealthCheck verifies that the target network is reachable through the gateway.
                  When the health check fails, traffic is rerouted to the next peer in PeerRefs.
                properties:
                  enabled:
                    description: Enabled activates periodic health checking.
                    type: boolean
                  failureThreshold:
                    default: 3
                    description: FailureThreshold is the number of consecutive failures
                      before marking unhealthy.
                    format: int32
                    minimum: 1
                    type: integer
                  intervalSeconds:
                    default: 30
                    description: IntervalSeconds is the probe interval.
                    format: int32
                    minimum: 5
                    type: integer
                  target:
                    description: |-
                      Target is the address to probe (e.g. "172.20.1.254:443").
                      TCP connect is used when a port is specified, ICMP ping otherwise.
                    type: string
                  timeoutSeconds:
                    default: 5
                    description: TimeoutSeconds is the probe timeout.
                    format: int32
                    minimum: 1
                    type: integer
                required:
                - enabled
                - target
                type: object
              ipsec:
                description: |-
                  IPsec lists site-to-site IPsec tunnels the active peer terminates
                  toward the networks in Routes, for example to a cloud VPN gateway.
                  Requires IPsec enabled on the agents (chart value agent.ipsec.enabled,
                  wirekubectl --ipsec). With tunnels set, status.ready means at least one
                  of them is Established.
                items:
                  description: |-
                    GatewayIPsecTunnel is a site-to-site IPsec tunnel terminated by the
                    gateway's active peer. Mesh traffic for the gateway's routes reaches that
                    peer through WireGuard and leaves through the tunnel; return traffic comes
                    back the same way. The gateway should not enable SNAT: the remote side
                    routes the local traffic selectors back through the tunnel.
                  properties:
                    dataplane:
                      default: Auto
                      description: Dataplane selects how traffic is steered into the
                        tunnel.
                      enum:
                      - Auto
                      - XFRMInterface
                      - Policy
                      type: string
                    dpd:
                      description: DPD configures dead peer detection.
                      properties:
                        action:
                          description: Action taken when the remote peer is declared
                            dead.
                          enum:
                          - restart
                          - clear
                          - trap
                          type: string
                        delaySeconds:
                          description: DelaySeconds between DPD checks when the tunnel
                            is idle. Defaults to 30.
                          format: int32
                          minimum: 1
                          type: integer
                      type: object
                    esp:
                      description: ESP configures the CHILD_SA.
                      properties:
                        lifetimeSeconds:
                          description: LifetimeSeconds is the CHILD_SA rekey time.
                            Defaults to 3600.
                          format: int32
                          minimum: 120
                          type: integer
                        proposals:
                          description: |-
                            Proposals are strongSwan ESP proposals. Defaults to
                            "aes256-sha256-modp2048".
                          items:
                            pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
                            type: string
                          type: array
                      type: object
                    forceEncapsulation:
                      description: |-
                        ForceEncapsulation forces UDP encapsulation (NAT-T on port 4500) even
                        when no NAT is detected. Useful when a firewall passes UDP but not ESP.
                      type: boolean
                    ike:
                      description: IKE configures the IKE_SA.
                      properties:
                        lifetimeSeconds:
                          description: LifetimeSeconds is the IKE_SA rekey time. Defaults
                            to 28800.
                          format: int32
                          minimum: 120
                          type: integer
                        proposals:
                          description: |-
                            Proposals are strongSwan IKE proposals, for example
                            "aes256-sha256-modp2048". Defaults to that single proposal.
                          items:
                            pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
                            type: string
                          type: array
                        version:
                          description: Version is the IKE version.
                          enum:
                          - 1
                          - 2
                          format: int32
                          type: integer
                      type: object
                    interfaceID:
                      description: |-
                        InterfaceID pins the XFRM interface ID. Zero derives a stable ID from
                        the tunnel name. 4294967295 is reserved by strongSwan.
                      format: int64
                      maximum: 4294967294
                      minimum: 0
                      type: integer
                    localID:
                      description: |-
                        LocalID is the IKE identity this side presents. Defaults to the IP
                        address in the active peer's WireKubePeer endpoint, which is the
                        address the remote gateway sees, also behind 1:1 NAT.
                      type: string
                    localTrafficSelectors:
                      description: |-
                        LocalTrafficSelectors are the networks on the mesh side that the remote
                        gateway routes into the tunnel. Defaults to the mesh CIDR. Add pod
                        CIDRs here when pods must reach the remote network directly.
                      items:
                        pattern: ^([0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}$
                        type: string
                      maxItems: 16
                      type: array
                    mtu:
                      description: |-
                        MTU of the XFRM interface. Defaults to 1400, which leaves room for ESP
                        with NAT-T inside a 1500-byte underlay.
                      format: int32
                      maximum: 9000
                      minimum: 576
                      type: integer
                    name:
                      description: Name identifies the tunnel within the gateway.
                      maxLength: 32
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    preSharedKeyRef:
                      description: |-
                        PreSharedKeyRef points at the pre-shared key. The Secret must live in
                        the agent's namespace; the agent reads no Secret outside it.
                      properties:
                        key:
                          description: Key within the Secret. Defaults to "psk".
                          type: string
                        name:
                          description: Name of the Secret.
                          minLength: 1
                          type: string
                      required:
                      - name
                      type: object
                    remoteAddress:
                      description: |-
                        RemoteAddress is the public address (IP or DNS name) of the remote
                        IPsec gateway, for example a cloud VPN gateway.
                      maxLength: 253
                      minLength: 1
                      pattern: ^[A-Za-z0-9]([-A-Za-z0-9.:]*[A-Za-z0-9])?$
                      type: string
                    remoteID:
                      description: |-
                        RemoteID is the IKE identity expected from the remote gateway.
                        Defaults to RemoteAddress.
                      type: string
                    remoteTrafficSelectors:
                      description: |-
                        RemoteTrafficSelectors are the networks behind the remote gateway.
                        Defaults to the gateway's routes, which is also what the mesh sends to
                        the gateway peer.
                      items:
                        pattern: ^([0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}$
                        type: string
                      maxItems: 16
                      type: array
                  required:
                  - name
                  - preSharedKeyRef
                  - remoteAddress
                  type: object
                maxItems: 8
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              peerRefs:
                description: |-
                  PeerRefs references WireKubePeer resources that serve as gateway nodes.
                  The first healthy peer is elected as the active gateway (HA failover).
                  Each entry is a WireKubePeer name (e.g. "node-worker1").
                items:
                  type: string
                minItems: 1
                type: array
              routes:
                description: |-
                  Routes defines the CIDR ranges accessible through this gateway.
                  These CIDRs are injected into each gateway peer's AllowedIPs and
                  kernel routing table entries on all mesh nodes.
                items:
                  description: GatewayRoute defines a network CIDR reachable through
                    the gateway.
                  properties:
                    cidr:
                      description: CIDR is the network range (e.g. "172.20.0.0/16").
                      pattern: ^([0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}$
                      type: string
                    description:
                      description: Description is a human-readable label for this
                        route.
                      type: string
                  required:
                  - cidr
                  type: object
                minItems: 1
                type: array
              snat:
                description: |-
                  SNAT configures source NAT on the gateway node so that return traffic
                  from the target network routes back through the gateway.
                properties:
                  enabled:
                    description: Enabled activates iptables MASQUERADE for traffic
                      forwarded through the gateway.
                    type: boolean
                  sourceIP:
                    description: |-
                      SourceIP overrides the SNAT source address.
                      When empty, the gateway node's first AllowedIP is used.
                    type: string
                required:
                - enabled
                type: object
            required:
            - peerRefs
            - routes
            type: object
          status:
            description: WireKubeGatewayStatus defines the observed state of WireKubeGateway.
            properties:
              activePeer:
                description: ActivePeer is the WireKubePeer name currently serving
                  as the active gateway.
                type: string
              conditions:
                description: Conditions reflect the current state of the gateway.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              ipsec:
                description: IPsec reports each tunnel in spec.ipsec.
                items:
                  description: |-
                    GatewayIPsecTunnelStatus is the observed state of one tunnel, written by
                    the gateway's active peer.
                  properties:
                    carrier:
                      description: |-
                        Carrier is true on the tunnel the remote networks are routed into.
                        Tunnels with identical remote selectors back each other up; only one
                        carries traffic at a time.
                      type: boolean
                    dataplane:
                      description: Dataplane is the steering mode in use on the active
                        peer.
                      enum:
                      - Auto
                      - XFRMInterface
                      - Policy
                      type: string
                    ikeState:
                      description: IKEState is the IKE_SA state reported by the IKE
                        daemon.
                      type: string
                    installedChildSAs:
                      description: InstalledChildSAs counts installed CHILD_SAs.
                      format: int32
                      type: integer
                    interfaceID:
                      description: InterfaceID is the XFRM interface ID in use.
                      format: int64
                      type: integer
                    interfaceName:
                      description: |-
                        InterfaceName is the XFRM interface carrying the tunnel on the active
                        peer; empty in Policy mode.
                      type: string
                    lastTransitionTime:
                      description: LastTransitionTime is when Phase last changed.
                      format: date-time
                      type: string
                    localID:
                      description: LocalID is the IKE identity in use after defaulting.
                      type: string
                    localTrafficSelectors:
                      description: |-
                        LocalTrafficSelectors and RemoteTrafficSelectors are the selectors the
                        active peer applied, after defaulting.
                      items:
                        type: string
                      type: array
                    message:
                      description: Message explains why the tunnel is not Established,
                        when known.
                      type: string
                    name:
                      description: Name of the tunnel in spec.ipsec.
                      type: string
                    phase:
                      description: Phase summarises the tunnel state.
                      enum:
                      - Pending
                      - Connecting
                      - Established
                      - Error
                      type: string
                    remoteTrafficSelectors:
                      items:
                        type: string
                      type: array
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              ipsecSummary:
                description: |-
                  IPsecSummary is a one-line tunnel state for kubectl get, such as
                  "1/2 Established".
                type: string
              lastHealthCheck:
                description: LastHealthCheck is the timestamp of the last health check
                  probe.
                format: date-time
                type: string
              peerHealth:
                additionalProperties:
                  type: string
                description: PeerHealth maps each peerRef to its health status ("healthy"
                  or "unhealthy").
                type: object
              ready:
                description: Ready indicates the gateway is healthy and forwarding
                  traffic.
                type: boolean
              routesInjected:
                description: RoutesInjected is the number of CIDR routes injected
                  into the active peer.
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
