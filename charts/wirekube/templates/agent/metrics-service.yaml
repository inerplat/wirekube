{{- if .Values.agent.metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: wirekube-agent-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wirekube.agent.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: agent
    {{- include "wirekube.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: wirekube-agent  # subset of agent selector labels
  ports:
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
{{- end }}
