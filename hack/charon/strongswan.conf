# strongSwan configuration for the wirekube-charon DaemonSet. The agent drives
# charon over vici and owns routing, so charon installs no routes or virtual
# IPs.
include strongswan.d/*.conf

charon {
	install_routes = no
	install_virtual_ip = no
	plugins {
		# bypass-lan derives pass-through policies from local routes, which
		# on a gateway include the tunnel routes.
		bypass-lan {
			load = no
		}
		vici {
			socket = unix:///run/wirekube-ipsec/charon.vici
		}
	}
	filelog {
		stderr {
			path = /dev/stderr
			default = 1
			ike = 1
			time_format = %Y-%m-%dT%H:%M:%S
		}
	}
}
